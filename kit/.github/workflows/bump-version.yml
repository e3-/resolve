name: Bump version

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bump-version:
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    name: "Bump version and create changelog with commitizen"
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create bump and changelog
        id: commitizen
        run: |
          pip install commitizen
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cz bump --yes
          echo "version=$(cz version --project)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        if: steps.commitizen.outputs.version != ''
        run: cz changelog --file-name body.md --incremental

      - name: Push bump commit and tags
        if: steps.commitizen.outputs.version != ''
        run: |
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git
          git push origin main --tags

      - name: Release
        if: steps.commitizen.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          body_path: "body.md"
          tag_name: ${{ steps.commitizen.outputs.version }}
          token: ${{ steps.app-token.outputs.token }}